name: Build
on:
  push:
    paths-ignore:
    - 'README.md'
  pull_request:
    paths-ignore:
    - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: nintendoswitch
            arch: aarch64
            artifact: vanilla-nintendoswitch-image.zip
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Registry cache reference
      id: cache
      shell: bash
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "ref=ghcr.io/$owner/vanilla-${{ matrix.platform.os }}-${{ matrix.platform.arch }}:buildcache" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/${{ matrix.platform.os }}/Dockerfile
        build-args: |
            ARCH=${{ matrix.platform.arch }}
        tags: vanilla-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
        load: true
        cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
        cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max

    - name: Run Docker container
      run: |
        docker run \
            -v "${{ github.workspace }}:/vanilla" \
            -v "${{ github.workspace }}/build:/install" \
            vanilla-${{ matrix.platform.os }}-${{ matrix.platform.arch }}

    - name: Archive
      run: |
        cd build
        zip -r ../${{ matrix.platform.artifact }} .

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.os }} ${{ matrix.platform.arch }}
        path: ${{ matrix.platform.artifact }}
